[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "groundmark"
version = "1.1.0"
description = "Grounded document extraction with Markdown, HTML, annotations, and document chat"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-PADDLEX"]
requires-python = ">=3.14"
dependencies = [
    "langchain-openai==1.6.2",
    "langchain-core==1.6.5",
    "langgraph==1.2.11",
    "openai==3.13.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "pillow==12.3.0",
    "streamlit==1.63.0",
    "pypdfium2==5.13.0",
]

[project.scripts]
groundmark = "src.cli:main"

[project.urls]
Repository = "https://github.com/pypi-ahmad/GroundMark"
Issues = "https://github.com/pypi-ahmad/GroundMark/issues"
Releases = "https://github.com/pypi-ahmad/GroundMark/releases"

[project.optional-dependencies]
layout = [
    "huggingface-hub==1.33.0",
    "opencv-python-headless==5.0.0.93",
    "onnxruntime-gpu[cuda,cudnn]==1.30.0",
    "numpy==2.5.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"prompts/runtime" = "src/_runtime_prompts"

[tool.hatch.build.targets.sdist]
include = ["/src", "/prompts/runtime", "/README.md", "/pyproject.toml", "/LICENSE", "/LICENSE-PADDLEX"]
