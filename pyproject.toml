[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "groundmark"
version = "0.1.0"
description = "Grounded document extraction with Markdown, HTML, annotations, and document chat"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "langchain-openai==1.6.2",
    "langchain-core==1.6.2",
    "langgraph==1.2.11",
    "openai==3.13.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "pillow==12.3.0",
    "streamlit==1.63.0",
    "pypdfium2==5.13.0",
]

[project.scripts]
groundmark = "src.cli:main"

[project.urls]
Repository = "https://github.com/pypi-ahmad/GroundMark"
Issues = "https://github.com/pypi-ahmad/GroundMark/issues"
Releases = "https://github.com/pypi-ahmad/GroundMark/releases"

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"prompts/runtime" = "src/_runtime_prompts"

[tool.hatch.build.targets.sdist]
include = ["/src", "/prompts/runtime", "/README.md", "/pyproject.toml", "/LICENSE"]

