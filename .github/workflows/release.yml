name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv python install 3.14.7
      - run: uv python pin 3.14.7
      - name: Validate tag and project version
        shell: python
        run: |
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match project version {version}")
      - run: uv sync --locked --all-groups
      - run: uv run python -m pytest tests -q --import-mode=importlib
      - run: uv build
      - run: uv run python scripts/verify_release_artifacts.py
      - name: Smoke test installed wheel
        run: |
          uv venv .wheel-smoke --python 3.14.7
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/groundmark --version
      - name: Write SHA-256 checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Create and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
