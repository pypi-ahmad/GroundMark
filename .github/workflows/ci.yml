name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv python install 3.14.7
      - run: uv python pin 3.14.7
      - run: uv sync --locked --all-groups
      - run: uv run python -m pytest tests -q --import-mode=importlib
      - run: uv build
      - run: uv run python scripts/verify_release_artifacts.py
      - name: Smoke test installed wheel
        run: |
          uv venv .wheel-smoke --python 3.14.7
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/groundmark --version
